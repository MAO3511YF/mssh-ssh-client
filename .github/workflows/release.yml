name: Release

# 推送 v* 标签时自动构建 Windows 安装包并创建 Release。
# 这样发版不需要本地 PAT，也不需要把二进制提交进仓库。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MSSH ${{ github.ref_name }}"
          releaseBody: |
            Windows x64 安装包（NSIS），见下方 Assets。

            ## v1.0.5 本版内容

            ### 安全加固（纵深防御）

            - **已保存密码与连接绑定**：密码在凭据库中连同保存时的 host / port / 用户名一起加密保存。连接时后端校验三者一致，不一致直接拒绝——即使渲染层被注入，也无法把某个连接的已保存密码送到攻击者服务器。
            - **前端不再拿到密码明文**：删除 `secret_get` 命令，只在 `ssh_connect` 内部由 Rust 从 DPAPI 凭据库取用；前端仅能查询「是否已保存密码」的布尔值，无法批量导出明文。
            - **密码内存擦除**：引入 `zeroize`，密码在内存中的副本（凭据库 / 连接配置 / 会话快照）在离开作用域时自动清零，Debug 输出也已遮蔽。
            - **敏感文件防护**：本地文件面板拒绝读写私钥与凭据文件（`id_*`、`*.pem`/`*.ppk`/`*.pfx`、`secrets.dat`、`.env*` 等），并按文件头嗅探 PEM / PuTTY / PGP 私钥内容；公钥不受影响。
            - **收紧 WebView**：关闭全局 Tauri 桥接（`withGlobalTauri=false`），启用严格 CSP（无 `unsafe-eval`），移除生产环境不需要的开发服务器 WebSocket 源。
            - **凭据生命周期**：切换为密钥 / agent / 免密认证时自动清除旧密码；删除连接同步清理凭据；非 Windows 构建不再静默退化为明文存储。

            ### 布局与体验

            - 左侧工作区栏可拖拽调整宽度（14%–38%），但保留最小宽度、不可折叠
            - 右侧监控面板默认关闭，由顶栏按钮控制开合，去掉了原来的收缩条
            - 编辑已保存密码的连接时可查看状态、主动清除；设置页新增「清空命令历史」与「清空编辑器缓存」入口

            ### 行为变化（需注意）

            - 由 v1.0.1 及更早版本升级时，旧凭据没有主机绑定保护，这些连接会提示「请编辑该连接重新输入密码后保存」，重新输入一次即可获得新保护
            - 修改已保存密码连接的 host / port / 用户名后，需重新输入一次密码（绑定的安全设计）

            ## 历史版本

            - v1.0.4：左侧固定、右侧默认关闭的布局改造
            - v1.0.3：新装不再预置示例工作区，由用户自行创建
            - v1.0.2：主机密钥 TOFU 校验、密码 DPAPI 加密、连接超时 / keepalive、若干稳定性修复
            - v1.0.1：单实例启动（双击不重复开窗口）、系统托盘
            - v1.0.0：首版发布
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
