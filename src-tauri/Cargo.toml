[package]
name = "mssh"
version = "1.0.10"
description = "MSSH - 现代化 SSH 客户端"
authors = ["MSSH"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "mssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：系统托盘；image-png / image-ico：托盘图标解码
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
# 单实例：重复双击启动时唤起已有窗口，而不是再开一个
tauri-plugin-single-instance = "2"
# 剪贴板：走 Rust 层读写系统剪贴板，避免 WebView2 的 navigator.clipboard 权限弹窗
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SSH 客户端协议栈（纯 Rust，无需系统 openssh）
# 默认 aws-lc-rs 需要 NASM；Windows 构建机没有，改用 ring 后端
russh = { version = "0.65.2", default-features = false, features = ["ring", "flate2", "rsa"] }
# SFTP 子系统（客户端），与 russh 0.65 兼容
russh-sftp = "3.0.1"
# 文件传输 base64 编解码
base64 = "0.22"
# 异步运行时与通道写入所需的 Bytes
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
bytes = "1"
# ~ 路径展开
dirs = "6"
anyhow = "1"
# 密码等敏感字符串在 drop 时自动擦除内存（serde feature 让 Zeroizing<String> 可直接反序列化）
zeroize = { version = "1", features = ["serde"] }
# 时间格式化（监控快照的文件修改时间）
chrono = "0.4"

# Windows DPAPI：连接密码加密存储（CryptProtectData / CryptUnprotectData）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
# 集成测试里生成临时 SSH 服务端主机密钥
rand = "0.10"
